[package]
name = "webby"
description = "webby, a small cross-platform WebKit browser"
version.workspace = true
edition.workspace = true

[dependencies]
dirs = "7.0.0"
webby-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
webkit6 = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"

[target."cfg(windows)".dependencies]
libloading = "0.9.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Ole"] }
