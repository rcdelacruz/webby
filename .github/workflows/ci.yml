name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["webkit/**", ".github/workflows/webkit-windows.yml"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the installers as a GitHub release, tagged v<version in Cargo.toml>"
        type: boolean
        default: false

jobs:
  # macOS and Linux only. The Windows build needs webby's own WebKit, which
  # is built on the build machine, so its installer is made there too and
  # added to the release by hand.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: packaging/linux/build-deb.sh

      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: webby-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  # Publishes the macOS and Linux installers as a GitHub release. Runs when a tag like
  # v0.1.0 is pushed, or when the workflow is started by hand with the
  # "release" box ticked (the release then creates the tag itself).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: installers/*
          generate_release_notes: true
