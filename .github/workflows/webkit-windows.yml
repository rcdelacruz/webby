name: WebKit for Windows

# Builds WebKit's Windows port from source, with webby's patches applied.
# A full build takes hours; compiler output is cached between runs, so a
# run that hits the time limit is continued by the next one. It is costly,
# so it only runs when started by hand, never on a push.
on:
  workflow_dispatch:

env:
  # WebKit revision to build: a branch name or a full commit hash.
  WEBKIT_REF: 5fb92adf43dcc854668e7e4879ff0064bd567c3d
  SOURCE: C:\wk
  CC: clang-cl
  CXX: clang-cl
  SCCACHE_GHA_ENABLED: "true"
  VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WebKit source
        shell: pwsh
        run: |
          git config --global core.autocrlf input
          git init $env:SOURCE
          cd $env:SOURCE
          git remote add origin https://github.com/WebKit/WebKit.git
          # Tests and benchmarks are most of the repository and are not built.
          git sparse-checkout set --no-cone '/*' '!/LayoutTests' '!/PerformanceTests' '!/JSTests' '!/Websites' '!/ManualTests'
          git fetch --depth 1 origin $env:WEBKIT_REF
          git checkout FETCH_HEAD
          "Building WebKit at $(git rev-parse HEAD)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Apply webby's patches
        shell: pwsh
        run: |
          $patches = Get-ChildItem webkit\patches -Filter *.patch | Sort-Object Name
          foreach ($patch in $patches) {
            "Applying $($patch.Name)"
            git -C $env:SOURCE apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch $($patch.Name) did not apply" }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install build tools
        shell: pwsh
        run: |
          choco install gperf ninja -y --no-progress
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          clang-cl --version; cmake --version; ninja --version; perl --version | Select-Object -First 2; ruby --version; gperf --version | Select-Object -First 1

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: webkit-vcpkg-${{ env.WEBKIT_REF }}-${{ github.run_id }}
          restore-keys: |
            webkit-vcpkg-${{ env.WEBKIT_REF }}-
            webkit-vcpkg-

      - name: Build WebKit
        shell: pwsh
        working-directory: ${{ env.SOURCE }}
        run: |
          perl Tools/Scripts/build-webkit --release --cmakeargs="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DENABLE_API_TESTS=OFF -DENABLE_LAYOUT_TESTS=OFF"
          if ($LASTEXITCODE -ne 0) { throw "build-webkit failed" }

      - name: Collect binaries
        shell: pwsh
        run: |
          # Everything webby needs next to webby.exe, in one flat folder:
          # WebKit itself, the libraries it was built against, and GStreamer's
          # plugins in a gstreamer-1.0 folder, which is how webby recognises
          # this build (see configure_gstreamer in crates/app).
          $release = Join-Path $env:SOURCE "WebKitBuild\Release"
          $bin = @("bin", "bin64") | ForEach-Object { Join-Path $release $_ } | Where-Object { Test-Path (Join-Path $_ "WebKit2.dll") } | Select-Object -First 1
          if (-not $bin) { throw "No WebKit2.dll under $release" }
          $deps = Join-Path $release "vcpkg_installed\x64-windows-webkit"
          New-Item -ItemType Directory -Path dist\gstreamer-1.0 | Out-Null
          Copy-Item (Join-Path $bin "*") dist -Recurse -Exclude *.pdb,*.ilk,*.exp,*.lib,test*,jsc.exe,LLInt*,TestWebKitAPI*,WebKitTestRunner*,DumpRenderTree*,MiniBrowser*,WebDriver*
          Copy-Item (Join-Path $deps "bin\*.dll") dist
          Copy-Item (Join-Path $deps "plugins\gstreamer\*.dll") dist\gstreamer-1.0
          Copy-Item (Join-Path $deps "tools\gstreamer\gst-plugin-scanner.exe") dist
          foreach ($needed in "WebKit2.dll", "gstreamer-1.0-0.dll", "gst-plugin-scanner.exe") {
            if (-not (Test-Path (Join-Path dist $needed))) { throw "$needed is missing from the collected files" }
          }
          $plugins = (Get-ChildItem dist\gstreamer-1.0 -Filter *.dll).Count
          if ($plugins -eq 0) { throw "No GStreamer plugins were collected" }
          $size = (Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum
          "Collected $((Get-ChildItem dist -Recurse -File).Count) files, $plugins GStreamer plugins, $([math]::Round($size / 1MB)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem dist | Sort-Object Length -Descending | Select-Object -First 40 Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: webkit-windows
          path: dist/*
          if-no-files-found: error

      - name: Compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats
